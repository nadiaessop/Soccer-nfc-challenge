<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>⚽ Soccer Challenge</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#071b2f;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center}
.app{width:min(92%,520px);padding:28px 18px;text-align:center}.ball{font-size:58px}.card{background:#10395c;border-radius:24px;padding:24px;box-shadow:0 10px 30px #0006}.tag{font-size:13px;letter-spacing:2px;opacity:.8}.challenge{font-size:28px;font-weight:800;margin:18px 0}.desc{font-size:18px;line-height:1.45}.points{font-size:22px;font-weight:700;margin:18px}.score{font-size:20px;margin:18px}.btn{border:0;border-radius:14px;padding:15px 20px;font-size:18px;font-weight:800;margin:6px;cursor:pointer}.primary{background:#2ed573;color:#052313}.secondary{background:#fff;color:#09213a}.small{font-size:13px;opacity:.7;margin-top:18px}
</style></head>
<body><main class="app"><div class="ball">⚽</div><div class="card"><div class="tag">SOCCER CHALLENGE</div><div id="challenge" class="challenge">Tap below to start!</div><div id="desc" class="desc">Get a random soccer skill challenge.</div><div id="points" class="points"></div><button class="btn primary" onclick="newChallenge()">🎲 New Challenge</button><button class="btn secondary" onclick="completeChallenge()">⭐ Complete + Points</button><div class="score">🏆 Score: <span id="score">0</span></div><div class="small">Have fun, play safely, and use a suitable space.</div></div></main>
<script>
const challenges=[
['Ball Master','Do 20 toe taps.','5'],['Quick Feet','Do 20 fast foot touches.','5'],['Target Shot','Hit a safe target 3 times.','10'],['Goal Time','Score 3 goals.','10'],['Dribble Slalom','Dribble around 5 markers and back.','10'],['Keep It Up','Try 5 keep-ups.','10'],['Passing Pro','Make 10 accurate passes.','10'],['Speed Dribble','Dribble to a marker and back as quickly as you can.','15'],['Weak Foot','Complete 5 passes using your non-dominant foot.','10'],['Cone Challenge','Dribble around 6 cones without touching them.','15'],['First Touch','Stop 5 passes under control.','10'],['Accuracy King','Pass the ball through a target 5 times.','15'],['Turn Master','Practise 5 controlled turns.','10'],['Inside-Outside','Do 10 inside-outside touches.','10'],['Shooting Streak','Score 3 goals in a row.','15'],['Captain Pass','Complete 15 short passes.','10'],['Fast Feet','Do 30 alternating touches.','10'],['Dribble Race','Complete two safe dribbling runs.','15'],['Target Pass','Hit a target with 5 passes.','15'],['Skill Mix','Choose 3 skills and perform each one.','20'],['Stop & Go','Dribble, stop, then accelerate 5 times.','15'],['Around the World','Dribble around 3 markers in a circle.','15'],['Goalkeeper','Stop 5 gentle shots or passes.','15'],['Team Player','Make 10 accurate passes with a partner.','10'],['Challenge Creator','Invent your own safe soccer skill.','10'],['Left & Right','Complete 5 touches with each foot.','10'],['Zig-Zag','Dribble through 5 markers in a zig-zag.','15'],['Power Pass','Make 10 firm, accurate passes.','10'],['Final Five','Score 5 goals or complete 5 target shots.','20'],['Champion Combo','Complete any 3 challenges you choose.','25']];
let score=0,last=-1,used=[];
function newChallenge(){if(used.length===challenges.length)used=[];let i;do{i=Math.floor(Math.random()*challenges.length)}while(i===last||used.includes(i));last=i;used.push(i);const c=challenges[i];document.getElementById('challenge').textContent=c[0];document.getElementById('desc').textContent=c[1];document.getElementById('points').textContent='⭐ '+c[2]+' points';}
function completeChallenge(){const p=document.getElementById('points').textContent.match(/\d+/);if(p){score+=Number(p[0]);document.getElementById('score').textContent=score;newChallenge();}}
</script></body></html>
